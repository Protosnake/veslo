<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Veslo" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Veslo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Drone Camera Viewfinder -->
    <div id="drone-osd" class="drone-osd">
      <div class="osd-scanlines"></div>
      <div class="osd-grade"></div>
      <div class="osd-vignette"></div>

      <!-- Viewfinder frame -->
      <div class="osd-frame">
        <span class="osd-corner tl"></span>
        <span class="osd-corner tr"></span>
        <span class="osd-corner bl"></span>
        <span class="osd-corner br"></span>
        <span class="osd-edge-tick left"></span>
        <span class="osd-edge-tick right"></span>
      </div>

      <!-- Top telemetry bar -->
      <div class="osd-topbar">
        <div class="osd-topbar-side">
          <span class="osd-strong" data-i18n="osd.drone">DRONE D-07</span>
          <span class="osd-sep">//</span>
          <span class="osd-dim" data-i18n="osd.borderPatrol">BORDER PATROL</span>
        </div>
        <div class="osd-topbar-side osd-right">
          <span class="osd-rec"><span class="osd-rec-dot"></span><span data-i18n="osd.rec">REC</span></span>
          <span class="osd-timecode" id="osd-timecode">00:00:00:00</span>
          <span class="osd-sep">·</span>
          <span class="osd-dim"><span data-i18n="osd.resolution">4K</span> <span id="osd-fps">--</span><span data-i18n="osd.fps">FPS</span></span>
        </div>
      </div>

      <!-- Heading tape -->
      <div class="osd-heading">
        <div class="osd-heading-window">
          <div class="osd-heading-tape" id="osd-heading-tape"></div>
          <div class="osd-heading-caret"></div>
        </div>
        <div class="osd-heading-val" id="osd-heading-val">000°</div>
      </div>

      <!-- Alert banner -->
      <div class="osd-alert" id="osd-alert" data-i18n="osd.alert.uplinkEstablished">UPLINK ESTABLISHED</div>

      <!-- Bottom telemetry -->
      <div class="osd-block osd-top-left">
        <div class="osd-readout"><span class="k" data-i18n="osd.alt">ALT</span><span class="v" id="osd-alt">34.0</span><span class="u">M</span></div>
        <div class="osd-readout"><span class="k" data-i18n="osd.spd">SPD</span><span class="v" id="osd-spd">00.0</span><span class="u">KN</span></div>
        <div class="osd-readout"><span class="k" data-i18n="osd.hdg">HDG</span><span class="v" id="osd-hdg">000</span><span class="u">°</span></div>
        <div class="osd-battery">
          <span class="k" data-i18n="osd.bat">BAT</span>
          <div class="osd-battery-bar"><div class="osd-battery-fill" id="osd-battery-fill"></div></div>
          <span class="v" id="osd-battery-val">100%</span>
        </div>
      </div>

      <div class="osd-block osd-bottom-right">
        <div class="osd-line"><span class="k" data-i18n="osd.gps">GPS</span> <span id="osd-gps">46.61 N / 30.72 E</span></div>
        <div class="osd-line"><span class="k" data-i18n="osd.wind">WIND</span> 03 KT <span class="osd-sep">·</span> <span class="k" data-i18n="osd.sat">SAT</span> <span class="osd-ok">12</span></div>
        <div class="osd-line"><span class="k" data-i18n="osd.threats">THREATS</span> <span id="osd-threat-count" class="osd-warn">0</span></div>
      </div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">
      <!-- Merged rank + score HUD -->
      <div class="hud-header">
        <div class="hud-panel rank-panel">
          <div class="rank-top">
            <span class="rank-badge-icon" id="hud-rank-badge" aria-hidden="true"></span>
            <div class="rank-info-group">
              <div class="rank-title-row">
                <span class="rank-name" id="hud-rank-title"></span>
                <span class="rank-score-pill" id="hud-score-pill"></span>
              </div>
              <div class="rank-bar-bg">
                <div class="rank-bar-fill" id="hud-rank-bar" style="width: 0%;"></div>
              </div>
            </div>
          </div>
          <div class="rank-meta">
            <span class="rank-next" id="hud-rank-next"></span>
            <span class="high-score-val"><span data-i18n="hud.best">BEST</span> <span id="hud-high-score">0</span></span>
          </div>
        </div>
      </div>

      <!-- Footer Control Hints -->
      <div class="hud-footer">
        <div class="control-pill">
          <span><kbd>W</kbd>/<kbd>S</kbd> <span data-i18n="controls.throttle"></span></span>
          <span><kbd>A</kbd>/<kbd>D</kbd> <span data-i18n="controls.steering"></span></span>
          <span><kbd>SPACE</kbd> <strong data-i18n="controls.strike"></strong></span>
        </div>
      </div>

      <!-- Touch Controls (mobile: left thumb throttle, right thumb steer + strike) -->
      <div class="touch-controls" id="touch-controls">
        <div class="touch-throttle" id="touch-throttle" role="group" aria-label="Throttle and reverse">
          <div class="throttle-track" id="touch-throttle-track">
            <span class="throttle-mark forward" aria-hidden="true"></span>
            <span class="throttle-mark reverse" aria-hidden="true"></span>
            <div class="throttle-knob" id="touch-throttle-knob"></div>
          </div>
        </div>

        <div class="touch-action">
          <div class="touch-row touch-row-top">
            <button
              class="touch-btn touch-hit"
              type="button"
              id="touch-hit"
              aria-label="Strike with oar"
            >
              <span class="touch-hit-label" data-i18n="controls.hitShort"></span>
              <span class="touch-hit-sub" data-i18n="controls.oar"></span>
            </button>
          </div>

          <div class="touch-row touch-row-bottom touch-steer" role="group" aria-label="Steering">
            <button
              class="touch-btn touch-steer-btn"
              type="button"
              id="touch-left"
              aria-label="Steer left"
            >
              <span class="steer-glyph" aria-hidden="true">&#8249;</span>
            </button>
            <button
              class="touch-btn touch-steer-btn"
              type="button"
              id="touch-right"
              aria-label="Steer right"
            >
              <span class="steer-glyph" aria-hidden="true">&#8250;</span>
            </button>
          </div>
        </div>
      </div>

      <button class="mobile-pause-btn" id="pause-btn" type="button" aria-label="Pause">
        <span class="pause-bars" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>

    <!-- Start / Instruction Modal -->
    <div class="modal-overlay" id="start-modal">
      <div class="modal-card">
        <h1 class="modal-title" data-i18n="modal.start.title"></h1>

        <div class="modal-block rule-highlight">
          <span data-i18n-html="modal.start.missionTitle"></span><br/>
          <span data-i18n-html="modal.start.missionWarning"></span>
        </div>

        <div class="stats-grid mission-grid">
          <div class="stat-item mission-item">
            <span class="stat-label" data-i18n="modal.start.oarTitle"></span>
            <span class="stat-val stat-val-sm is-gold" data-i18n="modal.start.oarPoints"></span>
            <span class="stat-desc" data-i18n="modal.start.oarDesc"></span>
          </div>
          <div class="stat-item mission-item">
            <span class="stat-label" data-i18n="modal.start.ramTitle"></span>
            <span class="stat-val stat-val-sm is-cyan" data-i18n="modal.start.ramPoints"></span>
            <span class="stat-desc" data-i18n="modal.start.ramDesc"></span>
          </div>
          <div class="stat-item mission-item span-2 is-danger">
            <span class="stat-label" data-i18n="modal.start.engineTitle"></span>
            <span class="stat-val stat-val-sm is-danger" data-i18n="modal.start.enginePoints"></span>
            <span class="stat-desc" data-i18n="modal.start.engineDesc"></span>
          </div>
        </div>

        <button class="action-btn" id="start-btn" data-i18n="modal.start.btn"></button>
      </div>
    </div>

    <!-- iOS Fullscreen / Add to Home Screen Prompt -->
    <div class="modal-overlay hidden" id="install-modal">
      <div class="modal-card">
        <div class="modal-eyebrow"><span class="osd-rec-dot"></span> <span data-i18n="fullscreen.prompt.eyebrow"></span></div>
        <h1 class="modal-title" data-i18n="fullscreen.prompt.title"></h1>
        <div class="modal-subtitle" data-i18n-html="fullscreen.prompt.body"></div>
        <button class="action-btn" id="install-continue-btn" data-i18n="fullscreen.prompt.btn"></button>
      </div>
    </div>

    <!-- Pause Modal -->
    <div class="modal-overlay hidden" id="pause-modal">
      <div class="modal-card">
        <div class="modal-eyebrow"><span class="osd-rec-dot"></span> <span data-i18n="modal.pause.eyebrow"></span></div>
        <h1 class="modal-title" data-i18n="modal.pause.title"></h1>
        <div class="modal-subtitle" data-i18n="modal.pause.subtitle"></div>
        <button class="action-btn" id="resume-btn" data-i18n="modal.pause.btn"></button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay hidden" id="game-over-modal">
      <div class="modal-card">
        <div class="modal-eyebrow danger"><span class="osd-rec-dot"></span> <span data-i18n="modal.over.eyebrow"></span></div>
        <h1 class="modal-title game-over-banner" id="game-over-title">BORDER BREACHED!</h1>
        <div class="modal-subtitle" id="game-over-subtitle">A smuggler reached the southern shore. Mission Failed.</div>

        <!-- Final Military Rank Achieved Card -->
        <div class="modal-block game-over-rank-box">
          <span class="game-over-rank-sub" data-i18n="modal.over.rankLabel"></span>
          <div class="game-over-rank-main">
            <span id="final-rank-badge"></span>
            <div>
              <div class="game-over-rank-title" id="final-rank-title"></div>
              <div class="game-over-rank-score" id="final-rank-score"></div>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label" data-i18n="modal.over.statScore"></span>
            <span class="stat-val is-gold" id="final-score">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label" data-i18n="modal.over.statSmacked"></span>
            <span class="stat-val" id="final-smacked">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label" data-i18n="modal.over.statFrogs"></span>
            <span class="stat-val" id="final-frogs">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label" data-i18n="modal.over.statSnakes"></span>
            <span class="stat-val" id="final-snakes">0</span>
          </div>
        </div>

        <button class="action-btn" id="restart-btn" data-i18n="modal.over.btn"></button>
      </div>
    </div>

    <!-- Landscape-only gate for touch devices -->
    <div class="orientation-lock" id="orientation-lock" aria-hidden="true">
      <svg class="orientation-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="22" y="8" width="20" height="48" rx="3" />
        <line x1="28" y1="12" x2="36" y2="12" />
        <path d="M47 25a19 19 0 0 1 5 13" />
        <path d="M52 32l-1 6-6-2" />
      </svg>
      <div class="orientation-title" data-i18n="orientation.title"></div>
      <div class="orientation-subtitle" data-i18n="orientation.subtitle"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
