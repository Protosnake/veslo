    <use href="#rank-chevron" x="10" y="20" width="24" height="7"/>
    <use href="#rank-chevron" x="10" y="27" width="24" height="7"/>
    <use href="#rank-chevron" x="10" y="34" width="24" height="7"/>
    <use href="#rank-chevron" x="10" y="41" width="24" height="7"/>
    <use href="#rank-chevron-wide" x="10" y="47" width="24" height="9"/>
    <circle cx="9" cy="52.5" r="1.9" fill="none" stroke="#e2bd62" stroke-width="1.1"/>
    <circle cx="35" cy="52.5" r="1.9" fill="none" stroke="#e2bd62" stroke-width="1.1"/>
  </symbol>
  <symbol id="rank-senior-master-sergeant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-chevron" x="10" y="16" width="24" height="6"/>
    <use href="#rank-chevron" x="10" y="22" width="24" height="6"/>
    <use href="#rank-chevron" x="10" y="28" width="24" height="6"/>
    <use href="#rank-chevron" x="10" y="34" width="24" height="6"/>
    <use href="#rank-chevron-wide" x="10" y="42" width="24" height="8"/>
    <use href="#rank-chevron-wide" x="10" y="50" width="24" height="8"/>
    <circle cx="9" cy="55" r="2" fill="none" stroke="#e2bd62" stroke-width="1.2"/>
    <circle cx="35" cy="55" r="2" fill="none" stroke="#e2bd62" stroke-width="1.2"/>
  </symbol>

