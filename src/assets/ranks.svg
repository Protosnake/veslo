    <path d="M13 17 L31 27 M31 17 L13 27" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
    <use href="#rank-star" x="16.5" y="26" width="11" height="11"/>
    <use href="#rank-star" x="16.5" y="39" width="11" height="11"/>
  </symbol>
  <symbol id="rank-general" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <path d="M13 14 L31 22 M31 14 L13 22" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
    <use href="#rank-star" x="16.5" y="21" width="11" height="11"/>
    <use href="#rank-star" x="16.5" y="32" width="11" height="11"/>
    <use href="#rank-star" x="16.5" y="43" width="11" height="11"/>
  </symbol>
</svg>
