<svg xmlns="http://www.w3.org/2000/svg" class="rank-sprite">
  <defs>
    <path id="rank-pagon" d="M4 10 L22 3 L40 10 V58 H4 Z" fill="#252e1f" stroke="#c9a24a" stroke-width="1.5"/>
    <path id="rank-pagon-inner" d="M7 12.5 L22 6.4 L37 12.5 V55 H7 Z" fill="none" stroke="#7f6b31" stroke-width="0.9"/>
    <circle id="rank-button" cx="22" cy="11.5" r="2.1" fill="#e2bd62" stroke="#6f5a25" stroke-width="0.8"/>
    <path id="rank-star-shape" d="M0 -10 L2.25 -3.09 L9.51 -3.09 L3.63 1.18 L5.88 8.09 L0 3.82 L-5.88 8.09 L-3.63 1.18 L-9.51 -3.09 L-2.25 -3.09 Z" fill="#e9c766"/>
    <symbol id="rank-chevron" viewBox="0 0 24 8">
      <path d="M1 7 L12 1 L23 7" fill="none" stroke="#e2bd62" stroke-width="2.4" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="rank-chevron-wide" viewBox="0 0 24 9">
      <path d="M1 8 L12 1.5 L23 8" fill="none" stroke="#e2bd62" stroke-width="4.2" stroke-linejoin="miter"/>
    </symbol>
    <symbol id="rank-star" viewBox="-10 -10 20 20">
      <use href="#rank-star-shape"/>
    </symbol>
  </defs>

  <!-- Soldiers / recruits -->
  <symbol id="rank-recruit" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
  </symbol>
  <symbol id="rank-soldier" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
  </symbol>
  <symbol id="rank-senior-soldier" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-chevron" x="10" y="45" width="24" height="8"/>
  </symbol>

  <!-- Sergeants -->
  <symbol id="rank-junior-sergeant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-chevron" x="10" y="37" width="24" height="8"/>
    <use href="#rank-chevron" x="10" y="45" width="24" height="8"/>
  </symbol>
  <symbol id="rank-sergeant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-chevron" x="10" y="29" width="24" height="8"/>
    <use href="#rank-chevron" x="10" y="37" width="24" height="8"/>
    <use href="#rank-chevron" x="10" y="45" width="24" height="8"/>
  </symbol>
  <symbol id="rank-senior-sergeant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-chevron" x="10" y="23" width="24" height="8"/>
    <use href="#rank-chevron" x="10" y="31" width="24" height="8"/>
    <use href="#rank-chevron" x="10" y="39" width="24" height="8"/>
    <use href="#rank-chevron" x="10" y="47" width="24" height="8"/>
  </symbol>
  <symbol id="rank-chief-sergeant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-chevron" x="10" y="27" width="24" height="7"/>
    <use href="#rank-chevron" x="10" y="34" width="24" height="7"/>
    <use href="#rank-chevron" x="10" y="41" width="24" height="7"/>
    <use href="#rank-chevron-wide" x="10" y="47" width="24" height="9"/>
  </symbol>
  <symbol id="rank-staff-sergeant" viewBox="0 0 44 62">
