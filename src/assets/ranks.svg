  </symbol>
  <symbol id="rank-lieutenant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-star" x="18" y="18" width="8" height="8"/>
    <use href="#rank-star" x="18" y="32" width="8" height="8"/>
  </symbol>
  <symbol id="rank-senior-lieutenant" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-star" x="18" y="16" width="8" height="8"/>
    <use href="#rank-star" x="18" y="26" width="8" height="8"/>
    <use href="#rank-star" x="18" y="36" width="8" height="8"/>
  </symbol>
  <symbol id="rank-captain" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-star" x="18" y="14" width="8" height="8"/>
    <use href="#rank-star" x="18" y="23" width="8" height="8"/>
    <use href="#rank-star" x="18" y="32" width="8" height="8"/>
    <use href="#rank-star" x="18" y="41" width="8" height="8"/>
  </symbol>

  <!-- Field officers -->
  <symbol id="rank-major" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-star" x="16.5" y="24" width="11" height="11"/>
  </symbol>
  <symbol id="rank-lieutenant-colonel" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-star" x="16.5" y="17" width="11" height="11"/>
    <use href="#rank-star" x="16.5" y="33" width="11" height="11"/>
  </symbol>
  <symbol id="rank-colonel" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <use href="#rank-star" x="16.5" y="13" width="11" height="11"/>
    <use href="#rank-star" x="16.5" y="27" width="11" height="11"/>
    <use href="#rank-star" x="16.5" y="41" width="11" height="11"/>
  </symbol>

  <!-- Generals -->
  <symbol id="rank-brigadier-general" viewBox="0 0 44 62">
    <use href="#rank-pagon"/><use href="#rank-pagon-inner"/><use href="#rank-button"/>
    <path d="M13 22 L31 34 M31 22 L13 34" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
    <use href="#rank-star" x="16.5" y="31" width="11" height="11"/>
  </symbol>
  <symbol id="rank-major-general" viewBox="0 0 44 62">
